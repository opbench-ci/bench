# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# GENERATED by gen-workflows.sh from the fragments beside it; edit those.
name: "x70-k: consolidated kind, 8 runners x 2 slots"

# Arm K: two persistent kind clusters per installation group per runner, one test at a time each, chainsaw cleanup only.
# Common to the three arms: 8 standard ubuntu-24.04 runners, the same 839
# directories split across them as in plans/w<i>/g/ (one runner holds the four
# small installation groups), two concurrent test slots per runner, the same
# pinned bundle, chainsaw v0.2.15, failFast off, no test retries, cold (no
# Actions cache is touched).
permissions:
  contents: read

on:
  push:
    branches: [x70/k-cold, x70/k-pilot]

concurrency:
  group: x70-bench
  cancel-in-progress: false

jobs:
  worker:
    name: k w${{ matrix.worker }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      BUNDLE_URL: ${{ vars.BUNDLE_URL }}
      BUNDLE_SHA256: ${{ vars.BUNDLE_SHA256 }}
      BUNDLE: ${{ github.workspace }}/bundle
      EVIDENCE: ${{ github.workspace }}/evidence
      BENCH_JOB: w${{ matrix.worker }}
      BENCH_ARM: k
      PLAN: ${{ github.workspace }}/.github/measurement/x70/plans/w${{ matrix.worker }}
      X70: ${{ github.workspace }}/.github/measurement/x70
      PHASE: ${{ github.workspace }}/.github/measurement/bench/phase.sh
      NODE_IMAGE: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
      HARNESS_ARTIFACT_DIR: /tmp/gh
      HARNESS_SNAPSHOT_CACHE: /tmp/gh-snapshots
      HARNESS_HUGETLBFS_DIR: /mnt/huge
    steps:
      - name: Mark job start
        run: echo "JOB_T0=$(date +%s%N)" >> "$GITHUB_ENV"
      - name: Checkout (this tree carries the measurement scripts and plans)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Checkout exact upstream test sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kyverno/kyverno
          ref: 945ac9ce8546ea6cd51370f24b615148c577da5e
          path: upstream
      - name: Start evidence and host telemetry
        run: |
          mkdir -p "$EVIDENCE"
          echo "{\"phase\":\"job_steps_start\",\"unix_ns\":$JOB_T0}" >> "$EVIDENCE/phases.jsonl"
          lscpu -J > "$EVIDENCE/lscpu.json"
          echo "{\"arm\":\"$BENCH_ARM\",\"worker\":${{ matrix.worker }},\"ref\":\"$GITHUB_REF_NAME\"}" > "$EVIDENCE/job.json"
          nohup vmstat -n -t 5 > "$EVIDENCE/vmstat.txt" 2>&1 &
      - uses: ./.github/actions/measurement/capture-runner
      # Tool downloads: up to three attempts, 30 s then 90 s apart, identical in
      # every arm. A retried attempt is a visible failed step in the job metadata;
      # nothing here retries a test.
      - name: Install tools (upstream actions)
        id: tools-1
        continue-on-error: true
        uses: ./.github/actions/tools/install
        with: {helm: true, cosign: true, yq: true}
      - name: Install tools (wait 30 s before attempt 2)
        if: steps.tools-1.outcome == 'failure'
        run: sleep 30
      - name: Install tools (attempt 2)
        id: tools-2
        if: steps.tools-1.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/tools/install
        with: {helm: true, cosign: true, yq: true}
      - name: Install tools (wait 90 s before attempt 3)
        if: steps.tools-2.outcome == 'failure'
        run: sleep 90
      - name: Install tools (attempt 3)
        if: steps.tools-2.outcome == 'failure'
        uses: ./.github/actions/tools/install
        with: {helm: true, cosign: true, yq: true}
      - name: Install chainsaw v0.2.15
        id: chainsaw-1
        continue-on-error: true
        uses: kyverno/action-install-chainsaw@06560d18422209e9c1e08e931d477d04bf2674c1 # v0.2.14
        with: {verify: true, release: v0.2.15}
      - name: Install chainsaw (wait 30 s before attempt 2)
        if: steps.chainsaw-1.outcome == 'failure'
        run: sleep 30
      - name: Install chainsaw v0.2.15 (attempt 2)
        id: chainsaw-2
        if: steps.chainsaw-1.outcome == 'failure'
        continue-on-error: true
        uses: kyverno/action-install-chainsaw@06560d18422209e9c1e08e931d477d04bf2674c1 # v0.2.14
        with: {verify: true, release: v0.2.15}
      - name: Install chainsaw (wait 90 s before attempt 3)
        if: steps.chainsaw-2.outcome == 'failure'
        run: sleep 90
      - name: Install chainsaw v0.2.15 (attempt 3)
        if: steps.chainsaw-2.outcome == 'failure'
        uses: kyverno/action-install-chainsaw@06560d18422209e9c1e08e931d477d04bf2674c1 # v0.2.14
        with: {verify: true, release: v0.2.15}
      - name: Download and verify public binary bundle
        run: |
          set -euo pipefail
          .github/measurement/bench/phase.sh bundle_download bash -c '
            curl --fail --location --retry 5 --retry-delay 15 --retry-all-errors --silent --show-error "$BUNDLE_URL" -o "$RUNNER_TEMP/bundle.tar.gz" &&
            echo "$BUNDLE_SHA256  $RUNNER_TEMP/bundle.tar.gz" | sha256sum -c - &&
            mkdir -p "$BUNDLE" && tar xzf "$RUNNER_TEMP/bundle.tar.gz" -C "$BUNDLE" &&
            (cd "$BUNDLE" && sha256sum --quiet -c SHA256SUMS)'
          cp "$RUNNER_TEMP/runner-profile.json" "$BUNDLE/provenance.json" "$EVIDENCE/" 2>/dev/null || true
      - name: Install kubectl-evict (once per runner; the generate suites need it)
        run: |
          set -euo pipefail
          .github/measurement/bench/phase.sh evict_install bash -c 'GOBIN="$HOME/go/bin" go install github.com/ueokande/kubectl-evict@latest'
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install kind v0.32.0
        run: |
          set -euo pipefail
          .github/measurement/bench/phase.sh kind_install bash -c '
            curl --fail --location --retry 5 --retry-delay 15 --retry-all-errors --silent --show-error -o "$RUNNER_TEMP/kind" https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64 &&
            curl --fail --location --retry 5 --retry-delay 15 --retry-all-errors --silent --show-error https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64.sha256sum | sed "s|kind-linux-amd64|$RUNNER_TEMP/kind|" | sha256sum -c - &&
            sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind'
          kind version >> "$EVIDENCE/tool-versions.txt"
      - name: Pull the kind node image once
        run: '"$PHASE" node_image_pull docker pull -q "$NODE_IMAGE"'
      - name: Build the Kyverno images once (every cluster on this runner side-loads them)
        run: |
          CI_SHAPED=1 CONTROLLERS=all KYVERNO_ROOT="$GITHUB_WORKSPACE/upstream" \
          P82_SUT_DIR="$BUNDLE/artifacts/sut/kyverno-admission" NODE_IMAGE="$NODE_IMAGE" BUILD_IMAGES_ONLY=1 \
            "$PHASE" kind_images "$BUNDLE/hack/p82-kind/up.sh" unused "$RUNNER_TEMP/unused"
      - name: Run this runner's directories on two kind slots
        run: |
          cat "$PLAN"/g/*.dirs > "$RUNNER_TEMP/kind.dirs"
          "$X70/kind-plan.py" --dirs "$RUNNER_TEMP/kind.dirs" --table "$X70/plans/dirs.tsv" --out "$RUNNER_TEMP/kind" > "$EVIDENCE/kind-plan.json"
          cat "$EVIDENCE/kind-plan.json"
          "$X70/kind-slot.sh" 0 "$RUNNER_TEMP/kind-s0.tsv" & p0=$!
          "$X70/kind-slot.sh" 1 "$RUNNER_TEMP/kind-s1.tsv" & p1=$!
          rc=0; wait $p0 || rc=1; wait $p1 || rc=1; exit $rc
      - name: Dispose runtime state
        if: always()
        run: '"$PHASE" dispose bash -c "kind delete clusters --all" || true'
      - name: Collect evidence
        if: always()
        run: |
          pkill vmstat || true
          echo "{\"phase\":\"job_steps_end\",\"unix_ns\":$(date +%s%N)}" >> "$EVIDENCE/phases.jsonl"
          "$GITHUB_WORKSPACE/.github/measurement/x70/emit-evidence.sh"
